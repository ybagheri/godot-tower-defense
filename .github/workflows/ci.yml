name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

env:
  GODOT_VERSION: 4.7.2-stable

jobs:
  test:
    name: Headless tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Cache Godot binary
        id: godot-cache
        uses: actions/cache@v4
        with:
          path: ~/godot-bin
          key: godot-${{ env.GODOT_VERSION }}

      - name: Install Godot
        if: steps.godot-cache.outputs.cache-hit != 'true'
        run: |
          mkdir -p ~/godot-bin
          curl -sL -o /tmp/godot.zip \
            "https://github.com/godotengine/godot/releases/download/${GODOT_VERSION}/Godot_v${GODOT_VERSION}_linux.x86_64.zip"
          unzip -o -q /tmp/godot.zip -d /tmp/godot-extract
          mv /tmp/godot-extract/Godot_v${GODOT_VERSION}_linux.x86_64 ~/godot-bin/godot
          chmod +x ~/godot-bin/godot

      - name: Import project
        run: ~/godot-bin/godot --headless --path . --import

      - name: Compile-check all scripts
        run: ~/godot-bin/godot --headless --path . -s tools/validate_scripts.gd

      - name: Unit + integration tests
        run: |
          ~/godot-bin/godot --headless --path . res://tests/test_runner.tscn

      - name: Logic stress smoke (150 enemies)
        timeout-minutes: 5
        run: |
          timeout 120 ~/godot-bin/godot --headless --path . \
            res://tools/stress_battle.tscn -- enemy_count=150 tower_count=15 frames=300 \
            | tee stress.txt
          grep -q "RESULT avg_frame" stress.txt

  android-debug-apk:
    name: Android debug APK
    runs-on: ubuntu-latest
    needs: test
    steps:
      - uses: actions/checkout@v4

      - name: Cache Godot binary
        id: godot-cache
        uses: actions/cache@v4
        with:
          path: ~/godot-bin
          key: godot-${{ env.GODOT_VERSION }}

      - name: Install Godot
        if: steps.godot-cache.outputs.cache-hit != 'true'
        run: |
          mkdir -p ~/godot-bin
          curl -sL -o /tmp/godot.zip \
            "https://github.com/godotengine/godot/releases/download/${GODOT_VERSION}/Godot_v${GODOT_VERSION}_linux.x86_64.zip"
          unzip -o -q /tmp/godot.zip -d /tmp/godot-extract
          mv /tmp/godot-extract/Godot_v${GODOT_VERSION}_linux.x86_64 ~/godot-bin/godot
          chmod +x ~/godot-bin/godot

      - name: Cache export templates (android only, ~90MB extracted)
        id: tpl-cache
        uses: actions/cache@v4
        with:
          path: ~/.local/share/godot/export_templates
          key: tpl-android-${{ env.GODOT_VERSION }}

      - name: Install Android export templates
        id: tpl_install
        if: steps.tpl-cache.outputs.cache-hit != 'true'
        run: |
          set -x
          URL="https://github.com/godotengine/godot/releases/download/${GODOT_VERSION}/Godot_${GODOT_VERSION}_export_templates.tpz"
          echo "### Template install" >> "$GITHUB_STEP_SUMMARY"
          for attempt in 1 2 3; do
            echo "attempt $attempt" | tee -a summary_tpl.txt
            rm -f /tmp/templates.tpz
            if curl --fail --location --retry 2 --retry-delay 10 \
                 -o /tmp/templates.tpz "$URL" 2>> summary_tpl.txt; then
              SIZE=$(stat -c%s /tmp/templates.tpz || echo 0)
              echo "downloaded bytes: $SIZE" | tee -a summary_tpl.txt
              echo 'first 64 bytes:' | tee -a summary_tpl.txt
              head -c 64 /tmp/templates.tpz | od -c | head -4 | tee -a summary_tpl.txt
              [ "$SIZE" -gt 100000000 ] && break
            fi
            command -v wget >/dev/null && wget -q -O /tmp/templates.tpz "$URL" && \
              [ "$(stat -c%s /tmp/templates.tpz)" -gt 100000000 ] && break
            sleep 15
          done
          cat summary_tpl.txt >> "$GITHUB_STEP_SUMMARY" || true
          unzip -t /tmp/templates.tpz > /dev/null
          mkdir -p ~/.local/share/godot/export_templates/${GODOT_VERSION}
          # Selective extract: only the two Android template APKs (~90 MB),
          # not the full 1.28 GB pack.
          unzip -j -o /tmp/templates.tpz 'templates/android_*' \
            -d ~/.local/share/godot/export_templates/${GODOT_VERSION}/
          rm /tmp/templates.tpz
          ls -la ~/.local/share/godot/export_templates/${GODOT_VERSION}/ | tee -a "$GITHUB_STEP_SUMMARY"

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Accept SDK licenses and install build tools
        run: |
          yes | sdkmanager --licenses > /dev/null || true
          sdkmanager --install "platform-tools" "build-tools;34.0.0" "platforms;android-34" > /dev/null

      - name: Generate debug keystore (CI-local, never committed)
        run: |
          mkdir -p ~/.android
          keytool -genkeypair -v -keystore ~/.android/debug.keystore \
            -alias androiddebugkey -storepass android -keypass android \
            -keyalg RSA -validity 10000 \
            -dname "CN=Android Debug,O=Android,C=US"

      - name: Export debug APK
        run: |
          ~/godot-bin/godot --headless --path . --import
          ~/godot-bin/godot --headless --path . \
            --export-debug "Android Debug" exports/godottd-debug.apk

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: godottd-debug-apk
          path: exports/godottd-debug.apk
          if-no-files-found: error
