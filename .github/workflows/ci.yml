name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

env:
  GODOT_VERSION: 4.7.2-stable

jobs:
  test:
    name: Headless tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Cache Godot binary
        id: godot-cache
        uses: actions/cache@v4
        with:
          path: ~/godot-bin
          key: godot-${{ env.GODOT_VERSION }}

      - name: Install Godot
        if: steps.godot-cache.outputs.cache-hit != 'true'
        run: |
          mkdir -p ~/godot-bin
          curl -sL -o /tmp/godot.zip \
            "https://github.com/godotengine/godot/releases/download/${GODOT_VERSION}/Godot_v${GODOT_VERSION}_linux.x86_64.zip"
          unzip -o -q /tmp/godot.zip -d /tmp/godot-extract
          mv /tmp/godot-extract/Godot_v${GODOT_VERSION}_linux.x86_64 ~/godot-bin/godot
          chmod +x ~/godot-bin/godot

      - name: Import project
        run: ~/godot-bin/godot --headless --path . --import

      - name: Compile-check all scripts
        run: ~/godot-bin/godot --headless --path . -s tools/validate_scripts.gd

      - name: Unit + integration tests
        run: |
          ~/godot-bin/godot --headless --path . res://tests/test_runner.tscn

      - name: Logic stress smoke (150 enemies)
        timeout-minutes: 5
        run: |
          timeout 120 ~/godot-bin/godot --headless --path . \
            res://tools/stress_battle.tscn -- enemy_count=150 tower_count=15 frames=300 \
            | tee stress.txt
          grep -q "RESULT avg_frame" stress.txt

  android-debug-apk:
    name: Android debug APK
    runs-on: ubuntu-latest
    needs: test
    steps:
      - uses: actions/checkout@v4

      - name: Restore Godot project import cache
        uses: actions/cache@v4
        with:
          path: .godot
          key: android-import-${{ runner.os }}-${{ hashFiles('project.godot') }}-${{ hashFiles('**/*.gd', '**/*.import', '**/*.tres', '**/*.tscn') }}
          restore-keys: |
            android-import-${{ runner.os }}-

      - name: Cache Godot binary
        id: godot-cache
        uses: actions/cache@v4
        with:
          path: ~/godot-bin
          key: godot-${{ env.GODOT_VERSION }}

      - name: Install Godot
        if: steps.godot-cache.outputs.cache-hit != 'true'
        run: |
          mkdir -p ~/godot-bin
          curl -sL -o /tmp/godot.zip \
            "https://github.com/godotengine/godot/releases/download/${GODOT_VERSION}/Godot_v${GODOT_VERSION}_linux.x86_64.zip"
          unzip -o -q /tmp/godot.zip -d /tmp/godot-extract
          mv /tmp/godot-extract/Godot_v${GODOT_VERSION}_linux.x86_64 ~/godot-bin/godot
          chmod +x ~/godot-bin/godot

      - name: Install Android export templates (from ci-assets branch)
        run: |
          set -e
          # Godot resolves templates as export_templates/<major>.<minor>.<patch>.<status>
          # (DOT-separated); the release-tag hyphen form (4.7.2-stable) never matches
          # and export aborts instantly with "No export template found". Proven
          # empirically against Godot 4.7.2 (see docs/11_Release/ANDROID.md).
          TPL_VER="${GODOT_VERSION/-/.}"
          TPL_DIR="$HOME/.local/share/godot/export_templates/${TPL_VER}"
          mkdir -p "$TPL_DIR"
          # Templates ship on the ci-assets branch as <100MB git chunks
          # (the official 1.28GB tpz is throttled/unreachable from runners).
          git fetch --depth=1 origin ci-assets
          git checkout FETCH_HEAD -- assets/android
          cat assets/android/android_debug.apk.part*   > "$TPL_DIR/android_debug.apk"
          cat assets/android/android_release.apk.part* > "$TPL_DIR/android_release.apk"
          # Strip ONLY the fetched chunk dir; a blanket "rm -rf assets"
          # would also wipe game audio/fonts/icons from the packaged PCK.
          rm -rf assets/android
          {
            echo "== templates @ $TPL_DIR =="
            ls -la "$TPL_DIR"
          } >> "$GITHUB_STEP_SUMMARY"
          # Fail fast HERE if reassembly produced junk instead of failing later.
          test -s "$TPL_DIR/android_debug.apk"
          test -s "$TPL_DIR/android_release.apk"

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Accept SDK licenses and install build tools
        run: |
          yes | sdkmanager --licenses > /dev/null || true
          sdkmanager --install "platform-tools" "build-tools;34.0.0" "platforms;android-34" > /dev/null

      - name: Generate debug keystore (CI-local, never committed)
        run: |
          mkdir -p ~/.android
          keytool -genkeypair -v -keystore ~/.android/debug.keystore \
            -alias androiddebugkey -storepass android -keypass android \
            -keyalg RSA -validity 10000 \
            -dname "CN=Android Debug,O=Android,C=US"

      - name: Configure Godot editor settings for Android
        run: |
          mkdir -p ~/.config/godot
          # Godot loads ~/.config/godot/editor_settings-<major>.<minor>.tres
          # (its binary format string is "editor_settings-%d.%d.tres").
          # Including the patch/status suffix makes Godot IGNORE the file,
          # so java/sdk paths would never reach the exporter.
          ES_MM="$(~/godot-bin/godot --version | sed -E 's/^([0-9]+\.[0-9]+).*/\1/')"
          ES_FILE="$HOME/.config/godot/editor_settings-${ES_MM}.tres"
          cat > "$ES_FILE" <<EOF
          [gd_resource type="EditorSettings" format=3]

          [resource]
          export/android/java_sdk_path="$JAVA_HOME"
          export/android/android_sdk_path="${ANDROID_HOME}"
          EOF
          echo "Wrote: $ES_FILE"
          cat "$ES_FILE"

      - name: Preflight sanity (fail loud, public annotations)
        run: |
          set -e
          SDK="${ANDROID_HOME:-/usr/local/lib/android/sdk}"
          echo "::notice::GODOT=$(~/godot-bin/godot --version)"
          echo "::notice::JAVA_HOME=${JAVA_HOME:-UNSET} ($("$JAVA_HOME/bin/java" -version 2>&1 | head -1))"
          echo "::notice::ANDROID_HOME=${ANDROID_HOME:-UNSET} ANDROID_SDK_ROOT=${ANDROID_SDK_ROOT:-UNSET}"
          echo "::notice::BUILD_TOOLS=$(ls "$SDK/build-tools" 2>/dev/null | tr '\n' ',')"
          echo "::notice::APKSIGNER_34=$([ -f "$SDK/build-tools/34.0.0/apksigner" ] && echo present || echo MISSING)"
          echo "::notice::PLATFORMS=$(ls "$SDK/platforms" 2>/dev/null | tr '\n' ',')"
          echo "::notice::TPL_DIRS=$(ls ~/.local/share/godot/export_templates 2>/dev/null | tr '\n' ',')"
          ES_FILE="$(ls -t ~/.config/godot/editor_settings-*.tres 2>/dev/null | head -1)"
          if [ ! -f "$ES_FILE" ]; then echo '::error::No editor_settings tres found'; exit 1; fi
          echo "::notice::ES_FILE=$ES_FILE"
          JAVA_P="$(sed -n 's|^export/android/java_sdk_path="\(.*\)"$|\1|p' "$ES_FILE")"
          ANDR_P="$(sed -n 's|^export/android/android_sdk_path="\(.*\)"$|\1|p' "$ES_FILE")"
          echo "::notice::ES_java_sdk_path=${JAVA_P:-EMPTY}"
          echo "::notice::ES_android_sdk_path=${ANDR_P:-EMPTY}"
          [ -n "$JAVA_P" ] && [ -x "$JAVA_P/bin/java" ] || { echo '::error::ES java_sdk_path empty or lacks bin/java'; exit 1; }
          [ -n "$ANDR_P" ] && [ -d "$ANDR_P/build-tools/34.0.0" ] || { echo '::error::ES android_sdk_path empty or lacks build-tools/34.0.0'; exit 1; }
          TPL="$HOME/.local/share/godot/export_templates/${GODOT_VERSION/-/.}"
          echo "::notice::TPL_DIR_EXPECTED=$TPL"
          [ -s "$TPL/android_debug.apk" ] || { echo "::error::Missing assembled debug template at $TPL"; exit 1; }
          [ -s "$HOME/.android/debug.keystore" ] || { echo '::error::debug keystore missing'; exit 1; }
          echo 'PREFLIGHT_OK'

      - name: Export debug APK
        run: |
          set -e
          mkdir -p exports
          ok=0
          for attempt in 1 2 3; do
            echo "::notice::EXPORT_ATTEMPT=$attempt"
            EXTRA=""
            [ "$attempt" -gt 1 ] && EXTRA="--verbose"
            ~/godot-bin/godot --headless $EXTRA --path . --import > "import_log_$attempt.txt" 2>&1 || true
            set +e
            ~/godot-bin/godot --headless $EXTRA \
              --export-debug --path . "Android Debug" exports/godottd-debug.apk \
              > "export_log_$attempt.txt" 2>&1
            EXIT_CODE=$?
            set -e
            {
              echo "### Attempt $attempt exit: $EXIT_CODE"
              echo '```'
              tail -40 "export_log_$attempt.txt"
              echo '```'
            } >> "$GITHUB_STEP_SUMMARY"
            if [ "$EXIT_CODE" -eq 0 ] && [ -s exports/godottd-debug.apk ]; then
              cp "export_log_$attempt.txt" export_log.txt
              echo "::notice::EXPORT_SUCCESS_ON_ATTEMPT=$attempt"
              ok=1
              break
            fi
            n=0
            while IFS= read -r line; do
              n=$((n+1))
              clean="$(printf '%s' "$line" | tr '\r' ' ' | cut -c1-400)"
              printf '::error::A%s_EXP[%02d]|%s\n' "$attempt" "$n" "$clean"
            done < <(tail -15 "export_log_$attempt.txt")
          done
          if [ "$ok" -ne 1 ]; then
            echo "::error::Godot export failed in all attempts."
            exit 1
          fi

      - name: Upload diagnostics on any result
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: android-export-diagnostics
          path: |
            export_log*.txt
            import_log*.txt
          if-no-files-found: ignore

      - name: Diagnostics bundle
        if: always()
        run: |
          {
            echo "== godot version =="; ~/godot-bin/godot --version
            echo "== which java =="; which java || true
            echo "== android/java env =="; printenv | grep -E '^(ANDROID_|JAVA_HOME)' || true
            echo "== ANDROID_HOME =="; echo "$ANDROID_HOME"; ls "$ANDROID_HOME" 2>/dev/null
            echo "== build-tools =="; ls "$ANDROID_HOME/build-tools" 2>/dev/null
            echo "== editor settings =="; ls -la ~/.config/godot/ 2>/dev/null; cat ~/.config/godot/editor_settings-*.tres 2>/dev/null
            echo "== templates =="; ls -la ~/.local/share/godot/export_templates/ 2>/dev/null; ls -la ~/.local/share/godot/export_templates/*/ 2>/dev/null
            echo "== keystore =="; ls -la ~/.android/ 2>/dev/null
            echo "== export log =="; cat export_log*.txt 2>/dev/null
          } > diagnostics.txt
          cat diagnostics.txt >> "$GITHUB_STEP_SUMMARY"

      - name: Upload debug APK
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: godottd-debug-apk
          path: exports/godottd-debug.apk
          if-no-files-found: error

  # Release APK (signed). Intentionally DORMANT: this job is a scaffold that
  # requires the maintainer to configure RELEASE_* secrets AND the
  # RELEASE_SIGNING_ENABLED repository variable first. See the manual
  # prerequisite section in docs/11_Release/ANDROID.md. Attempting to run it
  # without configured secrets fails loudly instead of shipping unsigned.
  android-release-apk:
    name: Android release APK (signed)
    runs-on: ubuntu-latest
    needs: android-debug-apk
    if: vars.RELEASE_SIGNING_ENABLED == 'true'
    steps:
      - uses: actions/checkout@v4
      - name: Fail fast when secrets are missing (never sign blind)
        env:
          KS_B64: ${{ secrets.RELEASE_KEYSTORE_BASE64 }}
          KS_PASS: ${{ secrets.RELEASE_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.RELEASE_KEY_ALIAS }}
          KEY_PASS: ${{ secrets.RELEASE_KEY_PASSWORD }}
        run: |
          if [ -z "$KS_B64" ] || [ -z "$KS_PASS" ] || [ -z "$KEY_ALIAS" ] || [ -z "$KEY_PASS" ]; then
            echo "::error::Release signing requested but RELEASE_* secrets are incomplete. See docs/11_Release/ANDROID.md"
            exit 1
          fi
      - name: Restore Godot project import cache
        uses: actions/cache@v4
        with:
          path: .godot
          key: android-import-${{ runner.os }}-${{ hashFiles('project.godot') }}-${{ hashFiles('**/*.gd', '**/*.import', '**/*.tres', '**/*.tscn') }}
          restore-keys: |
            android-import-${{ runner.os }}-
      - name: Cache Godot binary
        id: godot-cache
        uses: actions/cache@v4
        with:
          path: ~/godot-bin
          key: godot-${{ env.GODOT_VERSION }}
      - name: Install Godot
        if: steps.godot-cache.outputs.cache-hit != 'true'
        run: |
          mkdir -p ~/godot-bin
          curl -sL -o /tmp/godot.zip \
            "https://github.com/godotengine/godot/releases/download/${GODOT_VERSION}/Godot_v${GODOT_VERSION}_linux.x86_64.zip"
          unzip -o -q /tmp/godot.zip -d /tmp/godot-extract
          mv /tmp/godot-extract/Godot_v${GODOT_VERSION}_linux.x86_64 ~/godot-bin/godot
          chmod +x ~/godot-bin/godot
      - name: Install Android export templates (from ci-assets branch)
        run: |
          set -e
          TPL_VER="${GODOT_VERSION/-/.}"
          TPL_DIR="$HOME/.local/share/godot/export_templates/${TPL_VER}"
          mkdir -p "$TPL_DIR"
          git fetch --depth=1 origin ci-assets
          git checkout FETCH_HEAD -- assets/android
          cat assets/android/android_debug.apk.part*   > "$TPL_DIR/android_debug.apk"
          cat assets/android/android_release.apk.part* > "$TPL_DIR/android_release.apk"
          rm -rf assets/android
          test -s "$TPL_DIR/android_debug.apk"
          test -s "$TPL_DIR/android_release.apk"
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
      - name: Accept SDK licenses and install build tools
        run: |
          yes | sdkmanager --licenses > /dev/null || true
          sdkmanager --install "platform-tools" "build-tools;34.0.0" "platforms;android-34" > /dev/null
      - name: Decode keystore from secret
        env:
          KS_B64: ${{ secrets.RELEASE_KEYSTORE_BASE64 }}
          KS_PASS: ${{ secrets.RELEASE_KEYSTORE_PASSWORD }}
        run: |
          mkdir -p ~/.android
          echo "$KS_B64" | base64 -d > ~/.android/release.keystore
          test -s ~/.android/release.keystore || { echo '::error::decoded keystore empty'; exit 1; }
      - name: Configure Godot editor settings for Android
        run: |
          mkdir -p ~/.config/godot
          GODOT_MM="$(~/godot-bin/godot --version | cut -d. -f1-2)"
          cat > "~/.config/godot/editor_settings-${GODOT_MM}.tres" << SETTINGS
          [application]
          config/name="ci"

          [export]
          export/android/java_sdk_path="/usr/local/lib/android/sdk"
          export/android/android_sdk_path="/usr/local/lib/android/sdk"
          export/android/debug_keystore="~/.android/release.keystore"
          export/android/debug_keystore_user="${{ secrets.RELEASE_KEY_ALIAS }}"
          export/android/debug_keystore_pass="${{ secrets.RELEASE_KEYSTORE_PASSWORD }}"
          export/android/release_keystore="~/.android/release.keystore"
          export/android/release_keystore_user="${{ secrets.RELEASE_KEY_ALIAS }}"
          export/android/release_keystore_pass="${{ secrets.RELEASE_KEYSTORE_PASSWORD }}"
          SETTINGS
          ls -la ~/.config/godot/
      - name: Import project
        run: ~/godot-bin/godot --headless --path . --import
      - name: Export signed release APK
        run: |
          set -e
          ~/godot-bin/godot --headless --path . --export-release "Android Release" exports/godottd-release.apk \
            2>&1 | tee export_log.txt
          test -s exports/godottd-release.apk || { echo '::error::release APK missing'; exit 1; }
      - name: Upload signed release APK
        uses: actions/upload-artifact@v4
        with:
          name: godottd-release-apk
          path: exports/godottd-release.apk
      - name: Upload export diagnostics on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: android-release-diagnostics
          path: export_log.txt
